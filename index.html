<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAGELOG — K-POP Review</title>
<style>
:root{--bg:#f6f5f2;--ink:#201d25;--muted:#77727e;--pink:#f34f87;--purple:#7658df;--line:#e9e5e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.top{background:#211d29;color:white;padding:18px max(20px,calc((100% - 1100px)/2));font-weight:900;letter-spacing:1px}.top span{color:#ff75a4}.hero{background:#211d29;color:white;padding:48px 20px}.inner,main{max-width:1100px;margin:auto}.eyebrow{color:#ff91b4;font-size:11px;letter-spacing:3px}.hero h1{font-size:clamp(34px,6vw,58px);margin:12px 0}.hero p{color:#ccc5d1;line-height:1.8}.search{display:flex;gap:8px;max-width:600px}.search input{flex:1;min-width:0;padding:13px;border:0;border-radius:9px}.search button,button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;font-weight:750}.primary{background:var(--pink);color:white}.wrap{padding:30px 20px 70px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}.tools input,.tools select{padding:10px;border:1px solid var(--line);border-radius:9px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.song,.panel{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.art{height:125px;padding:14px;color:white;display:flex;align-items:end;font-size:23px;font-weight:900;background:linear-gradient(135deg,#f46b9b,#6652c8)}.song:nth-child(3n+2) .art{background:linear-gradient(135deg,#3e9eaa,#39305e)}.song:nth-child(3n) .art{background:linear-gradient(135deg,#e6a74b,#9b4e70)}.body{padding:14px}.artist{color:var(--muted);font-size:12px}.score{font-size:25px;font-weight:900;margin:10px 0}.body button{background:#f4f1f4;margin:3px 3px 0 0;font-size:12px}.panel{padding:17px;margin-top:24px}.rank{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.modal{display:none;position:fixed;inset:0;background:#17131dcc;padding:16px;overflow:auto;z-index:4}.modal.open{display:block}.dialog{max-width:680px;margin:20px auto;background:white;border-radius:16px;padding:22px}.close{float:right}.field{display:grid;grid-template-columns:150px 1fr 42px;gap:10px;align-items:center;margin:15px 0}.field label{font-size:13px}.field input{width:100%;accent-color:var(--purple)}.val{text-align:right;font-weight:900;color:var(--purple)}textarea{width:100%;min-height:75px;border:1px solid var(--line);border-radius:9px;padding:10px}.compare{margin-top:24px}.compare table{width:100%;border-collapse:collapse}.compare td,.compare th{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.muted{color:var(--muted);font-size:12px}
.detail-open{background:#f4f1f4;margin:3px 3px 0 0;font-size:12px;color:#51418d}
.detail-modal{display:none;position:fixed;inset:0;background:#17131ddd;padding:16px;overflow:auto;z-index:5}
.detail-modal.open{display:block}
.detail-dialog{max-width:760px;margin:20px auto;background:white;border-radius:16px;padding:22px;max-height:calc(100vh - 40px);overflow:auto}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.detail-score{font-size:38px;font-weight:900;color:var(--purple);margin:12px 0 4px}
.detail-count{color:var(--muted);font-size:13px}
.score-breakdown{margin:20px 0}
.score-line{display:grid;grid-template-columns:150px 1fr 42px;gap:10px;align-items:center;margin:12px 0;font-size:13px}
.score-track{height:9px;background:#eeeaf1;border-radius:99px;overflow:hidden}
.score-fill{height:100%;background:linear-gradient(90deg,#f46b9b,#7658df);border-radius:99px}
.review-entry{border-top:1px solid var(--line);padding:14px 0}
.review-entry-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.review-entry-score{font-weight:900;color:var(--purple)}
.review-entry p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.empty-state{padding:18px;background:#f8f6f8;border-radius:10px;color:var(--muted)}
@media(max-width:520px){.score-line{grid-template-columns:105px 1fr 35px;gap:6px;font-size:12px}.detail-dialog{padding:16px}}

@media(max-width:520px){.field{grid-template-columns:95px 1fr 35px;gap:6px}.hero{padding:35px 18px}}
</style></head>
<body>
<header class="top">STAGE<span>LOG</span></header>
<section class="hero"><div class="inner"><div class="eyebrow">K-POP MUSIC REVIEW PLATFORM</div><h1>音楽を、もっと深く。</h1><p>好きな曲を聴いて、感じたことを言葉とスコアで残す。<br>ファンの視点からK-POP楽曲の魅力を記録・比較するレビューサイト。</p><div class="search"><input id="q" placeholder="曲名・アーティストを検索"><button class="primary" onclick="render()">検索</button></div></div></section>
<main class="wrap"><p id="api-status" class="muted" aria-live="polite">データベースに接続しています…</p><div class="tools"><select id="group" onchange="render()"><option value="">すべてのアーティスト</option><option>IVE</option><option>NewJeans</option><option>LE SSERAFIM</option><option>aespa</option><option>SEVENTEEN</option></select><select id="sort" onchange="render()"><option value="score">総合評価順</option><option value="name">曲名順</option></select><button class="primary" onclick="openReview()">＋ レビューを書く</button></div><div id="songs" class="grid"></div><section class="panel"><h2>STAGELOG ランキング</h2><div id="ranking"></div><p class="muted">レビュー投稿はNeonデータベースに保存され、共有データとして表示されます。</p></section><section class="panel compare"><h2>楽曲を比較</h2><p class="muted">各曲の「比較に追加」で最大3曲を選択できます。</p><div id="comparison"></div></section></main>
<div class="detail-modal" id="detailModal" onclick="if(event.target===this)closeDetail()"><div class="detail-dialog"><div class="detail-head"><div><div class="eyebrow">STAGELOG SONG REVIEW</div><h2 id="detailTitle">楽曲詳細</h2><div id="detailArtist" class="artist"></div></div><button onclick="closeDetail()">閉じる ✕</button></div><div id="detailContent"></div></div></div>
<div class="modal" id="modal"><div class="dialog"><button class="close" onclick="closeReview()">閉じる ✕</button><h2 id="reviewTitle">レビューを書く</h2><p class="muted">各項目を0.1刻みで評価してください。総合評価は6項目とは独立して入力します。</p><div id="fields"></div><textarea id="comment" placeholder="楽曲の感想・レビュー"></textarea><p><button class="primary" onclick="saveReview()">レビューを保存</button></p></div></div>
<script>
const criteria=['楽曲構成・完成度','サウンド・アレンジ','ボーカル・ラップ','コンセプト・独創性','表現力・感情伝達','中毒性・印象度','総合評価'];
const seed=[['HEYA','IVE'],['Super Shy','NewJeans'],['ANTIFRAGILE','LE SSERAFIM'],['Drama','aespa'],['Super','SEVENTEEN'],['LOVE DIVE','IVE']];
let songs=seed.map((x,i)=>({id:i,title:x[0],artist:x[1],scores:[4.5,4.4,4.6,4.3,4.5,4.7,4.6],reviewRows:[]}));let selected=[],editing=0;
function avg(s,i=6){const vals=s.reviewRows.map(r=>Number(r.ratings[i])).filter(Number.isFinite);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null}function fmtScore(value){return value===null?'—':value.toFixed(1)}function esc(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
async function loadReviews(){try{const res=await fetch('/api/reviews');if(!res.ok)throw new Error('API '+res.status);const rows=await res.json();songs.forEach(s=>s.reviewRows=rows.filter(r=>Number(r.song_id)===s.id));document.getElementById('api-status').textContent='Neonデータベースに接続しました。レビューは共有データとして保存されます。';render();}catch(e){console.error(e);document.getElementById('api-status').textContent='Neonへの接続に失敗しました。CloudflareのDATABASE_URL設定とNeonのテーブルを確認してください。'}}

function render(){let q=document.getElementById('q').value.toLowerCase(),g=document.getElementById('group').value,arr=songs.filter(s=>(s.title+s.artist).toLowerCase().includes(q)&&(!g||s.artist===g));if(document.getElementById('sort').value==='score')arr.sort((a,b)=>(avg(b)??-1)-(avg(a)??-1));else arr.sort((a,b)=>a.title.localeCompare(b.title));document.getElementById('songs').innerHTML=arr.map(s=>`<article class="song"><div class="art">${esc(s.title)}</div><div class="body"><b>${esc(s.title)}</b><div class="artist">${esc(s.artist)}</div><div class="score">${fmtScore(avg(s))} <small> / 5.0</small></div><div class="muted">${s.reviewRows.length} reviews</div><button class="detail-open" onclick="openDetail(${s.id})">詳細を見る</button><button onclick="openReview(${s.id})">レビューする</button><button onclick="toggleCompare(${s.id})">${selected.includes(s.id)?'比較から削除':'比較に追加'}</button></div></article>`).join('')||'<p>該当する楽曲がありません。</p>';let ranked=[...songs].filter(s=>avg(s)!==null).sort((a,b)=>avg(b)-avg(a)).slice(0,5);document.getElementById('ranking').innerHTML=ranked.length?ranked.map((s,i)=>`<div class="rank"><span>${i+1}. ${esc(s.title)} — ${esc(s.artist)}</span><b>${fmtScore(avg(s))}</b></div>`).join(''):'<p class="muted">レビューが集まるとランキングが表示されます。</p>';renderCompare()}
function openDetail(id){const s=songs.find(x=>x.id===id);if(!s)return;document.getElementById('detailTitle').textContent=s.title;document.getElementById('detailArtist').textContent=s.artist;const breakdown=criteria.map((c,i)=>{const value=avg(s,i);return `<div class="score-line"><span>${esc(c)}</span><div class="score-track"><div class="score-fill" style="width:${value===null?0:value/5*100}%"></div></div><b>${fmtScore(value)}</b></div>`}).join('');const reviews=[...s.reviewRows].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const reviewHtml=reviews.length?reviews.map(r=>{const ratings=Array.isArray(r.ratings)?r.ratings:[];const overall=Number(ratings[6]);const date=r.created_at?new Date(r.created_at).toLocaleDateString('ja-JP'):'日付不明';return `<article class="review-entry"><div class="review-entry-head"><b>ユーザーレビュー</b><span class="review-entry-score">${Number.isFinite(overall)?overall.toFixed(1):'—'} / 5.0</span></div><div class="muted">${date}</div><p>${esc(r.comment||'コメントなし')}</p><div class="muted">${criteria.map((c,i)=>`${esc(c)}: ${Number.isFinite(Number(ratings[i]))?Number(ratings[i]).toFixed(1):'—'}`).join(' ・ ')}</div></article>`}).join(''):'<div class="empty-state">まだレビューはありません。この曲の最初のレビューを書いてみましょう。</div>';document.getElementById('detailContent').innerHTML=`<div class="detail-score">${fmtScore(avg(s))}<span style="font-size:16px;color:#777"> / 5.0</span></div><div class="detail-count">${s.reviewRows.length} 件のレビュー</div><section class="score-breakdown"><h3>評価項目別スコア</h3>${breakdown}</section><div class="detail-head"><h3>レビュー一覧</h3><button class="primary" onclick="closeDetail();openReview(${s.id})">レビューを書く</button></div>${reviewHtml}`;document.getElementById('detailModal').classList.add('open')}
function closeDetail(){document.getElementById('detailModal').classList.remove('open')}
function toggleCompare(id){if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<3)selected.push(id);else alert('比較できるのは最大3曲です');renderCompare()}
function renderCompare(){let a=selected.map(id=>songs.find(s=>s.id===id));document.getElementById('comparison').innerHTML=a.length?'<table><tr><th>評価項目</th>'+a.map(s=>'<th>'+esc(s.title)+'</th>').join('')+'</tr>'+criteria.map((c,i)=>'<tr><td>'+esc(c)+'</td>'+a.map(s=>'<td>'+fmtScore(avg(s,i))+'</td>').join('')+'</tr>').join('')+'</table>':'<p class="muted">比較する楽曲を選択してください。</p>'}
function openReview(id=0){editing=id;let s=songs.find(x=>x.id===id)||songs[0];document.getElementById('reviewTitle').textContent=s.title+' — '+s.artist;document.getElementById('fields').innerHTML=criteria.map((c,i)=>{const initial=avg(s,i)??4.0;return '<div class="field"><label>'+esc(c)+'</label><input type="range" min="0" max="5" step="0.1" value="'+initial.toFixed(1)+'" oninput="document.getElementById(\'v'+i+'\').textContent=(+this.value).toFixed(1)"><span class="val" id="v'+i+'">'+initial.toFixed(1)+'</span></div>'}).join('');document.getElementById('comment').value='';document.getElementById('modal').classList.add('open')}
function closeReview(){document.getElementById('modal').classList.remove('open')}
async function saveReview(){const ratings=[...document.querySelectorAll('#fields input')].map(x=>+x.value);const comment=document.getElementById('comment').value.trim();const button=document.querySelector('#modal .primary');button.disabled=true;button.textContent='保存中…';try{const res=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId:editing,ratings,comment})});if(!res.ok)throw new Error(await res.text());closeReview();await loadReviews();}catch(e){alert('保存できませんでした。DATABASE_URLとテーブル設定を確認してください。');console.error(e)}finally{button.disabled=false;button.textContent='レビューを保存'}}
render();loadReviews();
</script></body></html>
