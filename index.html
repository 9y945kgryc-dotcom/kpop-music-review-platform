<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAGELOG — K-POP Review</title>
<style>
:root{--bg:#f6f5f2;--ink:#201d25;--muted:#77727e;--pink:#f34f87;--purple:#7658df;--line:#e9e5e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.top{background:#211d29;color:white;padding:18px max(20px,calc((100% - 1100px)/2));font-weight:900;letter-spacing:1px}.top span{color:#ff75a4}.hero{background:#211d29;color:white;padding:48px 20px}.inner,main{max-width:1100px;margin:auto}.eyebrow{color:#ff91b4;font-size:11px;letter-spacing:3px}.hero h1{font-size:clamp(34px,6vw,58px);margin:12px 0}.hero p{color:#ccc5d1;line-height:1.8}.search{display:flex;gap:8px;max-width:600px}.search input{flex:1;min-width:0;padding:13px;border:0;border-radius:9px}.search button,button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;font-weight:750}.primary{background:var(--pink);color:white}.wrap{padding:30px 20px 70px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}.tools input,.tools select{padding:10px;border:1px solid var(--line);border-radius:9px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.song,.panel{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.art{height:125px;padding:14px;color:white;display:flex;align-items:end;font-size:23px;font-weight:900;background:linear-gradient(135deg,#f46b9b,#6652c8)}.song:nth-child(3n+2) .art{background:linear-gradient(135deg,#3e9eaa,#39305e)}.song:nth-child(3n) .art{background:linear-gradient(135deg,#e6a74b,#9b4e70)}.body{padding:14px}.artist{color:var(--muted);font-size:12px}.score{font-size:25px;font-weight:900;margin:10px 0}.body button{background:#f4f1f4;margin:3px 3px 0 0;font-size:12px}.panel{padding:17px;margin-top:24px}.rank{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.modal{display:none;position:fixed;inset:0;background:#17131dcc;padding:16px;overflow:auto;z-index:4}.modal.open{display:block}.dialog{max-width:680px;margin:20px auto;background:white;border-radius:16px;padding:22px}.close{float:right}.field{display:grid;grid-template-columns:150px 1fr 42px;gap:10px;align-items:center;margin:15px 0}.field label{font-size:13px}.field input{width:100%;accent-color:var(--purple)}.val{text-align:right;font-weight:900;color:var(--purple)}textarea{width:100%;min-height:75px;border:1px solid var(--line);border-radius:9px;padding:10px}.compare{margin-top:24px}.compare table{width:100%;border-collapse:collapse}.compare td,.compare th{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.muted{color:var(--muted);font-size:12px}@media(max-width:520px){.field{grid-template-columns:95px 1fr 35px;gap:6px}.hero{padding:35px 18px}}
</style></head>
<body>
<header class="top">STAGE<span>LOG</span></header>
<section class="hero"><div class="inner"><div class="eyebrow">K-POP MUSIC REVIEW PLATFORM</div><h1>音楽を、もっと深く。</h1><p>好きな曲を聴いて、感じたことを言葉とスコアで残す。<br>ファンの視点からK-POP楽曲の魅力を記録・比較するレビューサイト。</p><div class="search"><input id="q" placeholder="曲名・アーティストを検索"><button class="primary" onclick="render()">検索</button></div></div></section>
<main class="wrap"><div class="tools"><select id="group" onchange="render()"><option value="">すべてのアーティスト</option><option>IVE</option><option>NewJeans</option><option>LE SSERAFIM</option><option>aespa</option><option>SEVENTEEN</option></select><select id="sort" onchange="render()"><option value="score">総合評価順</option><option value="name">曲名順</option></select><button class="primary" onclick="openReview()">＋ レビューを書く</button></div><div id="songs" class="grid"></div><section class="panel"><h2>STAGELOG ランキング</h2><div id="ranking"></div><p class="muted">評価はユーザー投稿をブラウザ内に保存するプロトタイプです。</p></section><section class="panel compare"><h2>楽曲を比較</h2><p class="muted">各曲の「比較に追加」で最大3曲を選択できます。</p><div id="comparison"></div></section></main>
<div class="modal" id="modal"><div class="dialog"><button class="close" onclick="closeReview()">閉じる ✕</button><h2 id="reviewTitle">レビューを書く</h2><p class="muted">各項目を0.1刻みで評価してください。総合評価は6項目とは独立して入力します。</p><div id="fields"></div><textarea id="comment" placeholder="楽曲の感想・レビュー"></textarea><p><button class="primary" onclick="saveReview()">レビューを保存</button></p></div></div>
<script>
const criteria=['楽曲構成・完成度','サウンド・アレンジ','ボーカル・ラップ','コンセプト・独創性','表現力・感情伝達','中毒性・印象度','総合評価'];
const seed=[['HEYA','IVE'],['Super Shy','NewJeans'],['ANTIFRAGILE','LE SSERAFIM'],['Drama','aespa'],['Super','SEVENTEEN'],['LOVE DIVE','IVE']];
let songs=seed.map((x,i)=>({id:i,title:x[0],artist:x[1],scores:[4.5,4.4,4.6,4.3,4.5,4.7,4.6],reviews:0,comments:[]}));let selected=[],editing=0;
try{const saved=JSON.parse(localStorage.getItem('stagelog-reviews')||'[]');saved.forEach(r=>{let s=songs.find(x=>x.id===r.id);if(s){s.scores=r.scores;s.reviews=r.reviews;s.comments=r.comments}})}catch(e){}
function avg(s){return s.scores[6].toFixed(1)}
function render(){let q=document.getElementById('q').value.toLowerCase(),g=document.getElementById('group').value,arr=songs.filter(s=>(s.title+s.artist).toLowerCase().includes(q)&&(!g||s.artist===g));if(document.getElementById('sort').value==='score')arr.sort((a,b)=>b.scores[6]-a.scores[6]);else arr.sort((a,b)=>a.title.localeCompare(b.title));document.getElementById('songs').innerHTML=arr.map(s=>`<article class="song"><div class="art">${s.title}</div><div class="body"><b>${s.title}</b><div class="artist">${s.artist}</div><div class="score">${avg(s)} <small> / 5.0</small></div><div class="muted">${s.reviews} reviews</div><button onclick="openReview(${s.id})">レビューする</button><button onclick="toggleCompare(${s.id})">比較に追加</button></div></article>`).join('')||'<p>該当する楽曲がありません。</p>';document.getElementById('ranking').innerHTML=[...songs].sort((a,b)=>b.scores[6]-a.scores[6]).slice(0,5).map((s,i)=>`<div class="rank"><span>${i+1}. ${s.title} — ${s.artist}</span><b>${avg(s)}</b></div>`).join('');renderCompare()}
function toggleCompare(id){if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<3)selected.push(id);else alert('比較できるのは最大3曲です');renderCompare()}
function renderCompare(){let a=selected.map(id=>songs.find(s=>s.id===id));document.getElementById('comparison').innerHTML=a.length?'<table><tr><th>評価項目</th>'+a.map(s=>'<th>'+s.title+'</th>').join('')+'</tr>'+criteria.map((c,i)=>'<tr><td>'+c+'</td>'+a.map(s=>'<td>'+s.scores[i].toFixed(1)+'</td>').join('')+'</tr>').join('')+'</table>':'<p class="muted">比較する楽曲を選択してください。</p>'}
function openReview(id=0){editing=id;let s=songs.find(x=>x.id===id)||songs[0];document.getElementById('reviewTitle').textContent=s.title+' — '+s.artist;document.getElementById('fields').innerHTML=criteria.map((c,i)=>'<div class="field"><label>'+c+'</label><input type="range" min="0" max="5" step="0.1" value="'+s.scores[i]+'" oninput="document.getElementById(\'v'+i+'\').textContent=(+this.value).toFixed(1)"><span class="val" id="v'+i+'">'+s.scores[i].toFixed(1)+'</span></div>').join('');document.getElementById('comment').value='';document.getElementById('modal').classList.add('open')}
function closeReview(){document.getElementById('modal').classList.remove('open')}
function saveReview(){let s=songs.find(x=>x.id===editing);s.scores=[...document.querySelectorAll('#fields input')].map(x=>+x.value);let c=document.getElementById('comment').value.trim();if(c)s.comments.push(c);s.reviews++;localStorage.setItem('stagelog-reviews',JSON.stringify(songs));closeReview();render()}
render();
</script></body></html>
